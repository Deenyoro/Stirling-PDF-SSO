name: Build & push Stirling-PDF-SSO image

# Auto-builds the SSO/Enterprise-unlocked Docker image on every push to the
# default branch (including when you "Sync fork" from upstream Stirling-PDF),
# on manual dispatch, and weekly as a safety rebuild. The image is pushed to
# GitHub Container Registry (GHCR).
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "sso/deploy/**"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: sso-docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  housekeeping:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Disable foreign workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Upstream's own workflows (PR labelers, stale-bot, scorecard,
          # nightly e2e, release/publish jobs) only make sense on
          # Stirling-Tools/Stirling-PDF. On the fork they burn minutes and go
          # red purely from upstream's state. Disabling them through the
          # Actions API — rather than committing sso/ci-patches/ into
          # .github/workflows — keeps the "the fork never modifies an
          # upstream-tracked file" invariant that makes every sync
          # conflict-free, and it also covers workflows upstream adds later.
          keep=".github/workflows/sso-docker-build.yml .github/workflows/upstream-auto-sync.yml"
          gh api "repos/${{ github.repository }}/actions/workflows" --paginate \
            -q '.workflows[] | [(.id|tostring), .state, .path] | @tsv' |
          while IFS=$'\t' read -r id state path; do
            case " $keep " in
              *" $path "*) continue ;;
            esac
            if [ "$state" = "active" ]; then
              echo "Disabling foreign workflow: $path"
              gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$id/disable"
            fi
          done

  build:
    # Self-hosted runner scale set in the AG-Talos cluster
    # (helmrelease at kubernetes/apps/github/actions-runner-controller/
    # runner-scale-sets/stirling-pdf-sso/). The runner pod is ephemeral
    # with an 80 GiB Ceph RBD volume mounted at /var/lib/docker for DinD.
    runs-on: stirling-pdf-sso
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so heal-patches.sh can 3-way re-anchor drifted
          # patches against their pre-image blobs.
          fetch-depth: 0

      - name: Self-heal drifted SSO patches
        # Re-anchors sso/patches/*.patch against the current tree (git apply
        # --3way) and pushes the refreshed diffs back, so upstream refactors
        # never accumulate drift and the Docker build's patch step keeps
        # landing exactly. Only a rewrite of the exact unlock lines stops it.
        env:
          HEAL_PUSH_BRANCH: ${{ github.ref_type == 'branch' && github.ref_name || '' }}
        run: bash sso/script/heal-patches.sh

      - name: Verify the overlay contract still holds
        run: |
          bash sso/script/verify-patches.sh
          bash sso/script/check-upstream-contract.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name and version
        id: vars
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${owner}/stirling-pdf-sso" >> "$GITHUB_OUTPUT"
          echo "tag=$(date +%Y.%m.%d)-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # arm64 builds via QEMU are very slow for this image; add linux/arm64 here if you need it.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            STIRLING_FLAVOR=proprietary
            VERSION_TAG=${{ steps.vars.outputs.tag }}
          # Build cache lives in GHCR next to the image, NOT in the GitHub
          # Actions cache. type=gha,mode=max exported several GB against a
          # 10 GiB per-repo limit that was already ~7 GiB full: the export
          # took minutes (178s just to *prepare*), and a runner teardown
          # during that window failed the job even though the image had
          # already been pushed successfully. The registry cache writes over
          # the same connection as the push, has no such quota, and is
          # shared across ephemeral runners.
          cache-from: type=registry,ref=${{ steps.vars.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.vars.outputs.image }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Summary
        run: |
          {
            echo "### Stirling-PDF-SSO image pushed"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
