# Stirling-PDF SSO fork image, built on GitLab and mirrored to GHCR.
#
# Ported from .github/workflows/sso-docker-build.yml. The GitHub job disabled
# upstream workflows and pushed refreshed patches back to the repo; neither
# belongs in a GitLab build. CI only VERIFIES the patches here — the fork
# already ships sso/script/verify-patches.sh for exactly that.
#
# Gates, in order: patches + upstream contract (verify-patches), backend unit
# tests on the overlaid tree (backend-tests), image build, then a runtime smoke
# test of the built image (sso/script/smoke-test-image.sh) before it is pushed.
#
# The Dockerfile applies the overlay and patches itself, so the build context
# is the repo as committed.

stages: [test, build]

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"

variables:
  GIT_DEPTH: "0"

verify-patches:
  stage: test
  tags: [linux]
  image: alpine:3.20
  script:
    - apk add --no-cache bash git patch rsync >/dev/null
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # Dry-runs every required source and CI patch; exits non-zero on drift.
    - bash sso/script/verify-patches.sh
    - bash sso/script/check-upstream-contract.sh

# Backend unit tests on the overlaid tree: the overlay's own
# PremiumFeatureUnlockTest, the patched LicenseKeyChecker/KeygenLicenseVerifier
# tests, and upstream's whole common/core/proprietary suite (security, OAuth2,
# SAML, session, user management). Same command as upstream's backend-build.yml
# (`./gradlew build -PnoSpotless`, flavor=proprietary), minus the frontend.
backend-tests:
  stage: test
  tags: [linux]
  image: gradle:9.7.1-jdk25@sha256:e06837018d077ee7f1218e53499425ca7615702ad58856d980c154caa17eb093
  needs: [verify-patches]
  timeout: 2h
  variables:
    STIRLING_FLAVOR: proprietary
    GRADLE_USER_HOME: /work/gradle-home
    GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:+UseG1GC"
    JDK_JAVA_OPTIONS: >-
      --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED
      --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED
      --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED
      --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED
      --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED
    KUBERNETES_CPU_LIMIT: "8"
    KUBERNETES_MEMORY_LIMIT: 16Gi
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends patch rsync >/dev/null
    # Run outside /builds: upstream's TaggedContentExtractorRealFilesTest skips
    # every path containing "/build" when it walks the repo for its PDF corpus,
    # so under GitLab's /builds/<group>/<project> it would find nothing.
    - mkdir -p /work/src && rsync -a ./ /work/src/
    - cd /work/src
    - bash sso/script/apply-overlay.sh
    - bash sso/script/apply-patches.sh
    # The overlay test must be in the tree, or this job proves nothing about it.
    - test -f app/proprietary/src/test/java/stirling/software/proprietary/security/configuration/ee/PremiumFeatureUnlockTest.java
    # AppConfig#machineType reports "Kubernetes" when KUBERNETES_SERVICE_HOST is
    # set, which the runner pod always has; upstream's tests expect a plain host.
    - rc=0; env -u KUBERNETES_SERVICE_HOST -u KUBERNETES_SERVICE_PORT gradle build -PnoSpotless -x sonarqube --no-daemon --continue || rc=$?
    - for m in common core proprietary; do mkdir -p "$CI_PROJECT_DIR/app/$m/build/test-results"; rsync -a "app/$m/build/test-results/" "$CI_PROJECT_DIR/app/$m/build/test-results/" || true; done
    - exit $rc
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit:
        - app/*/build/test-results/test/TEST-*.xml

build:
  stage: build
  tags: [linux]
  image: docker:27
  services: ["docker:27-dind"]
  needs: [verify-patches, backend-tests]
  timeout: 3h
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
    DOCKER_BUILDKIT: "1"
    # A full Gradle/Java build; the GitHub job allowed 90 minutes and 80 GiB.
    KUBERNETES_CPU_LIMIT: "16"
    KUBERNETES_MEMORY_LIMIT: 32Gi
    KUBERNETES_EPHEMERAL_STORAGE_LIMIT: 120Gi
  script:
    - for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
    - |
      DATE_TAG="$(date -u +%Y.%m.%d)-${CI_COMMIT_SHA:0:8}"
      TAGS="sha-${CI_COMMIT_SHORT_SHA} ${DATE_TAG}"
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] || [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS latest"
      fi
      echo "$TAGS" > .tags
      docker build --build-arg STIRLING_FLAVOR=proprietary --build-arg "VERSION_TAG=$DATE_TAG" \
        --label org.opencontainers.image.source="$CI_PROJECT_URL" \
        --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
        -t stirling-pdf-sso:candidate .
    # Boot the image like the cluster does (login + Authentik OIDC, no license
    # key) and check the unlock and the SSO redirect before anything is pushed.
    - sh sso/script/smoke-test-image.sh stirling-pdf-sso:candidate
    - |
      if [ "${DOCKER_PUSH:-true}" != "true" ]; then
        echo "DOCKER_PUSH=$DOCKER_PUSH: built but not published"
        exit 0
      fi
      echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
      for t in $(cat .tags); do
        docker tag stirling-pdf-sso:candidate "$CI_REGISTRY_IMAGE:$t"
        docker push "$CI_REGISTRY_IMAGE:$t"
      done
      if [ -n "$GHCR_TOKEN" ]; then
        echo "$GHCR_TOKEN" | docker login -u "${GHCR_USER:-Deenyoro}" --password-stdin ghcr.io
        for t in $(cat .tags); do
          docker tag stirling-pdf-sso:candidate "ghcr.io/${GHCR_OWNER:-deenyoro}/stirling-pdf-sso:$t"
          docker push "ghcr.io/${GHCR_OWNER:-deenyoro}/stirling-pdf-sso:$t"
        done
      fi
      echo "Published: $(cat .tags)"
